receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:

exporters:
  logging:
    verbosity: detailed
  prometheus:
    endpoint: "0.0.0.0:8889"
  otlp: # Export to Tempo for traces
    endpoint: tempo:4317
    tls:
      insecure: true
  jaeger: # This seems redundant if otlp exporter goes to Tempo, but keeping it based on original request.
    endpoint: "jaeger:14250"
    tls:
      insecure: true
  loki:
    endpoint: http://loki:3100/api/v1/push

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, jaeger, logging] # otlp for Tempo, jaeger for direct Jaeger (if needed)
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, logging]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki, logging]