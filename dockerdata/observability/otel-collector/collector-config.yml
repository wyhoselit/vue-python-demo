receivers:
  otlp:
    protocols:
      grpc:
      http:
        cors:
          allowed_origins:
            - "http://localhost:5173"
            - "http://localhost:4317"
          allowed_headers:
            - "*"
  prometheus:
    config:
      scrape_configs:
        - job_name: 'nginx'
          scrape_interval: 10s
          static_configs:
            - targets: ['nginx-exporter:9113']

processors:
  batch:
  groupbyattrs:
    keys:
      - service.name

exporters:
  logging:
    verbosity: detailed
  prometheus:
    endpoint: "0.0.0.0:8889"
  otlp: # Export to Tempo for traces
    endpoint: tempo:4317
    tls:
      insecure: true

  loki:
    endpoint: http://loki:3100/loki/api/v1/push


service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, logging] # otlp for Tempo, jaeger for direct Jaeger (if needed)
    metrics:
      receivers: [otlp, prometheus]
      processors: [groupbyattrs, batch]
      exporters: [prometheus, logging]
    logs:
      receivers: [otlp]
      processors: [groupbyattrs, batch]
      exporters: [loki, logging]