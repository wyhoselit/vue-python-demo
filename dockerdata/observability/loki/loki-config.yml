auth_enabled: false

server:
  http_listen_port: 3100

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 5m
  chunk_retain_period: 30s

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /tmp/loki/data/index
    cache_location: /tmp/loki/data/cache
    shared_store: filesystem
  filesystem:
    directory: /tmp/loki/data/chunks

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h

chunk_store_config:
  max_look_back_period: 30d

compactor:
  shared_store: filesystem
  working_directory: /tmp/loki/data/compactor_working_dir

table_manager:
  retention_deletes_enabled: true
  retention_period: 30d