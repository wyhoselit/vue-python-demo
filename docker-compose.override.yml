version: '3.8'

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.90.1
    command: [ --config=/etc/otel-collector-config.yml ]
    volumes:
      - ./dockerdata/observability/otel-collector/collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter
    depends_on:
      - prometheus
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./dockerdata/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"


  grafana:
    image: grafana/grafana:10.2.2
    ports:
      - "3000:3000"
    volumes:
      - ./dockerdata/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./dockerdata/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - postgres
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_DB=grafana
      - POSTGRES_USER=grafana
      - POSTGRES_PASSWORD=grafana
    volumes:
      - ./dockerdata/observability/grafana/data/postgres:/var/lib/postgresql/data:Z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 5s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.9.2
    command: -config.file=/etc/loki/local-config.yml
    user: "0" # 1. 關鍵：強制讓 Podman 以主機用戶權限執行，防止 mkdir 失敗
    volumes:
      - ./dockerdata/observability/loki/loki-config.yml:/etc/loki/local-config.yml
      - ./dockerdata/observability/loki/data:/tmp/loki:Z
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.2.2
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./dockerdata/observability/tempo/tempo-config.yml:/etc/tempo/tempo.yml
      - ./dockerdata/observability/tempo/data:/tmp/tempo
    ports:
      - "14268:14268" # Jaeger gRPC
      - "14250:14250" # Jaeger Thrift
      - "3200:3200" # Tempo UI/HTTP
      - "9411:9411" # Zipkin

  test-sender:
    image: alpine/curl
    volumes:
      - ./dockerdata/observability/otel-collector/test-sender.sh:/usr/local/bin/test-sender.sh
    command: >
      sh -c "
        chmod +x /usr/local/bin/test-sender.sh &&
        /usr/local/bin/test-sender.sh
      "
    depends_on:
      - otel-collector
